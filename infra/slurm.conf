ClusterName=researchlab
SlurmctldHost=controller
SlurmUser=slurm
AuthType=auth/munge
SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/lib/slurm
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldTimeout=60
SlurmdTimeout=20
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
JobCompType=jobcomp/filetxt
JobCompLoc=/var/lib/slurm/job-completions.log
SlurmdParameters=config_overrides
MinJobAge=300
NodeName=worker[1-2] CPUs=2 RealMemory=512 State=UNKNOWN
PartitionName=local Nodes=worker[1-2] Default=YES MaxTime=00:10:00 State=UP
# FIFO priority without an accounting association database.
PriorityType=priority/basic
