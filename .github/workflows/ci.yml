name: Lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python lab.py up
      - run: python verify_lab.py
      - if: always()
        run: docker compose logs > runs/cluster.log; docker compose down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence
          path: runs/
